<svg width="512" height="512" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CyberGuard Logo</title>
<desc>Logo huruf C berbentuk cyber/tech dengan warna hijau dan hitam</desc>

<style>
  .scan { fill: none; stroke: #00ff88; stroke-width: 1; opacity: 0.15; }
  .corner { fill: none; stroke: #00ff88; stroke-width: 3; opacity: 0.6; }
  .circuit { fill: none; stroke: #00ff88; stroke-width: 1.5; opacity: 0.25; }
  .dot { fill: #00ff88; }
</style>

<!-- Background -->
<rect width="680" height="680" fill="#0a0f0a" rx="40"/>

<!-- Grid lines -->
<line x1="0" y1="170" x2="680" y2="170" class="scan"/>
<line x1="0" y1="340" x2="680" y2="340" class="scan"/>
<line x1="0" y1="510" x2="680" y2="510" class="scan"/>
<line x1="170" y1="0" x2="170" y2="680" class="scan"/>
<line x1="340" y1="0" x2="340" y2="680" class="scan"/>
<line x1="510" y1="0" x2="510" y2="680" class="scan"/>

<!-- Corner decorations -->
<path d="M40 100 L40 40 L100 40" class="corner"/>
<path d="M580 40 L640 40 L640 100" class="corner"/>
<path d="M40 580 L40 640 L100 640" class="corner"/>
<path d="M580 640 L640 640 L640 580" class="corner"/>

<!-- Circuit traces -->
<path d="M40 200 L100 200 L100 160 L160 160" class="circuit"/>
<path d="M640 200 L580 200 L580 160 L520 160" class="circuit"/>
<path d="M40 480 L100 480 L100 520 L160 520" class="circuit"/>
<path d="M640 480 L580 480 L580 520 L520 520" class="circuit"/>

<!-- Circuit nodes -->
<circle cx="100" cy="200" r="5" fill="#00ff88" opacity="0.4"/>
<circle cx="580" cy="200" r="5" fill="#00ff88" opacity="0.4"/>
<circle cx="100" cy="480" r="5" fill="#00ff88" opacity="0.4"/>
<circle cx="580" cy="480" r="5" fill="#00ff88" opacity="0.4"/>

<!-- Main C shape -->
<path d="M520 200 A200 200 0 1 0 520 480"
  fill="none" stroke="#00ff88" stroke-width="72" stroke-linecap="round"/>

<!-- Inner cutout -->
<path d="M505 215 A168 168 0 1 0 505 465"
  fill="none" stroke="#0a0f0a" stroke-width="40" stroke-linecap="round"/>

<!-- C opening clean cuts -->
<rect x="460" y="148" width="120" height="72" fill="#0a0f0a"/>
<rect x="460" y="460" width="120" height="72" fill="#0a0f0a"/>

<!-- C tips tech style -->
<rect x="448" y="168" width="80" height="36" rx="4" fill="#00ff88"/>
<rect x="448" y="476" width="80" height="36" rx="4" fill="#00ff88"/>

<!-- Tech notches on tips -->
<rect x="508" y="168" width="12" height="36" fill="#0a0f0a"/>
<rect x="508" y="476" width="12" height="36" fill="#0a0f0a"/>

<!-- Inner C glow lines -->
<path d="M490 230 A150 150 0 1 0 490 450"
  fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
<path d="M470 248 A130 130 0 1 0 470 432"
  fill="none" stroke="#00ff88" stroke-width="1" opacity="0.15" stroke-linecap="round"/>

<!-- Center dot -->
<circle cx="340" cy="340" r="12" fill="#00ff88"/>
<circle cx="340" cy="340" r="20" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>
<circle cx="340" cy="340" r="30" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.2"/>

<!-- Cross hairs -->
<line x1="340" y1="300" x2="340" y2="320" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
<line x1="340" y1="360" x2="340" y2="380" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
<line x1="300" y1="340" x2="320" y2="340" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
<line x1="360" y1="340" x2="380" y2="340" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>

<!-- Corner dots -->
<circle cx="160" cy="160" r="3" fill="#00ff88" opacity="0.5"/>
<circle cx="520" cy="160" r="3" fill="#00ff88" opacity="0.5"/>
<circle cx="160" cy="520" r="3" fill="#00ff88" opacity="0.5"/>
<circle cx="520" cy="520" r="3" fill="#00ff88" opacity="0.5"/>
<circle cx="200" cy="340" r="2" fill="#00ff88" opacity="0.3"/>
<circle cx="480" cy="340" r="2" fill="#00ff88" opacity="0.3"/>

<!-- Bottom text -->
<text x="340" y="630"
  font-family="monospace" font-size="22" font-weight="700"
  fill="#00ff88" text-anchor="middle" letter-spacing="8" opacity="0.7">CYBERGUARD</text>

<!-- Bottom line accent -->
<line x1="200" y1="612" x2="480" y2="612" stroke="#00ff88" stroke-width="1" opacity="0.3"/>

</svg>